# A graphic PHP app (forms drawn by JumPHP\Gui, no HTML). Every key is optional (defaults: JumPHP\Kernel\GameConfig).
project:
  id: jumphpsql              # lower case, unique: also the app's data folder
  title: "jumphpsql"
  version: 0.1.0
  description: "A MySQL / MariaDB client: browse databases and tables, edit rows, run SQL, make SQL dumps."
  descriptions:
    fr: "Un client MySQL / MariaDB : parcourir les bases et les tables, éditer les lignes, exécuter du SQL, faire des dumps SQL."
    en: "A MySQL / MariaDB client: browse databases and tables, edit rows, run SQL, make SQL dumps."
  kind: gui                     # the IDE opens its forms/*.form.yaml in the visual editor
  view: window                  # the view is the window, pixel for pixel: the forms lay themselves out in it
  width: 1024                   # the window's first size (dp)
  height: 700
  scale: 1
  background: '#f3f4f7'
  start_scene: App\Form\MainForm
  lang: en
  touch: false                  # no game pad on phones: the forms are touched directly
  ssh: true                     # bin/jumphp run gives it your ssh-agent and ~/.ssh (read only): SSH tunnels
  pause_on_blur: false
  mute_when_hidden: true
  smoke:
    scene: App\Form\MainForm
    params: { demo: true }
